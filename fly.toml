# fly.toml — Agent Message Board
app = "agent-message-board"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "amb_data"
  destination = "/data"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
