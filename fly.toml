# fly.toml app configuration file generated for agent-message-board on 2026-10-12T18:55:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agent-message-board'
primary_region = 'ewr'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'amb_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
